name: Build Arch, Fedora, and Debian release packages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-linux-release.yml
      - CMakeLists.txt
      - "*.h"
      - packaging/**
      - README.md
      - README.ru.md
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: "0.1.1"

jobs:
  debian:
    name: Build Debian package
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake debhelper dpkg-dev g++ \
            qt6-base-dev qt6-base-dev-tools tar

      - name: Build package and source archive
        run: |
          set -eux
          cp -a packaging/debian/debian ./debian
          chmod 0755 debian/rules
          dpkg-buildpackage -b -us -uc -a amd64
          mkdir -p out/source
          cp ../kyt-dl-gui_*.deb out/
          mkdir -p /tmp/source/kyt-dl-gui-${RELEASE_TAG}
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/source/kyt-dl-gui-${RELEASE_TAG}
          tar -czf "out/source/kyt-dl-gui-${RELEASE_TAG}.tar.gz" -C /tmp/source "kyt-dl-gui-${RELEASE_TAG}"

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: out/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: out/source/*.tar.gz
          if-no-files-found: error

  fedora:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y ca-certificates cmake gcc-c++ make qt6-qtbase-devel rpm-build tar gzip

      - name: Build RPM from current source
        run: |
          set -eux
          topdir="${HOME}/rpmbuild"
          mkdir -p "${topdir}/BUILD" "${topdir}/BUILDROOT" "${topdir}/RPMS" "${topdir}/SOURCES" "${topdir}/SPECS" "${topdir}/SRPMS"
          mkdir -p /tmp/source/kyt-dl-gui-${RELEASE_TAG}
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/source/kyt-dl-gui-${RELEASE_TAG}
          tar -czf "${topdir}/SOURCES/kyt-dl-gui-${RELEASE_TAG}.tar.gz" -C /tmp/source "kyt-dl-gui-${RELEASE_TAG}"
          cp packaging/common/kyt-dl-gui.desktop "${topdir}/SOURCES/"
          cp packaging/fedora/kyt-dl-gui.spec "${topdir}/SPECS/"
          rpmbuild -ba "${topdir}/SPECS/kyt-dl-gui.spec" --define "_topdir ${topdir}"
          mkdir -p out
          cp "${topdir}/RPMS/x86_64/kyt-dl-gui-${RELEASE_TAG}-"*.x86_64.rpm out/

      - uses: actions/upload-artifact@v4
        with:
          name: fedora-package
          path: out/*.rpm
          if-no-files-found: error

  arch:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed cmake gcc qt6-base fakeroot

      - name: Build Arch package
        run: |
          set -eux
          mkdir -p /tmp/arch-build/source out
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/arch-build/source
          cat > /tmp/arch-build/PKGBUILD <<'PKGBUILD'
          pkgname=kyt-dl-gui
          pkgver=0.1.1
          pkgrel=1
          pkgdesc="Qt desktop application for downloading video and audio with yt-dlp"
          arch=('x86_64')
          url="https://github.com/misha908473-sketch/kyt-dl-gui"
          license=('unknown')
          depends=('qt6-base' 'yt-dlp' 'ffmpeg')
          makedepends=('cmake' 'gcc' 'make')
          source=()
          sha256sums=()

          prepare() {
            mkdir -p "$srcdir/kyt-dl-gui"
            cp -a "$startdir/source/." "$srcdir/kyt-dl-gui/"
          }

          build() {
            cmake -S "$srcdir/kyt-dl-gui" -B "$srcdir/kyt-dl-gui/build" -DCMAKE_BUILD_TYPE=Release
            cmake --build "$srcdir/kyt-dl-gui/build" --parallel
          }

          package() {
            install -Dm755 "$srcdir/kyt-dl-gui/build/ytdlp-gui" "$pkgdir/usr/bin/ytdlp-gui"
            install -Dm644 "$srcdir/kyt-dl-gui/packaging/common/kyt-dl-gui.desktop" "$pkgdir/usr/share/applications/kyt-dl-gui.desktop"
          }
          PKGBUILD
          useradd --create-home builder
          chown -R builder:builder /tmp/arch-build
          su builder -c 'cd /tmp/arch-build && makepkg --nodeps --force --noconfirm'
          cp /tmp/arch-build/*.pkg.tar.zst out/

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  attach-to-release:
    name: Attach packages to release 0.1.1
    runs-on: ubuntu-latest
    needs: [debian, fedora, arch]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: dist/debian
      - uses: actions/download-artifact@v4
        with:
          name: fedora-package
          path: dist/fedora
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist/arch
      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist/source

      - name: Upload current packages and source to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already published"
            exit 0
          fi
          gh release create "${RELEASE_TAG}" --target "${GITHUB_SHA}" --title "Kyt-dl GUI ${RELEASE_TAG}" --notes "Keep video qualities and audio bitrates in separate files. Show finished media with format-like names in the library." dist/debian/*.deb dist/fedora/*.rpm dist/arch/*.pkg.tar.zst dist/source/*.tar.gz --repo "${GITHUB_REPOSITORY}"
